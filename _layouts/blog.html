---
layout: compress
---

{% include head.html %}

<main>
  {% include header.html %}

  {{ content }}

  <ul class="blog-posts">
    {% for post in site.posts %}
      <li>
        <span><i><time datetime="{{ post.date | date_to_xmlschema }}" pubdate>{{ post.date | date: "%b %-d, %Y" }}</time></i></span>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</main>

{% include footer.html %}

</body>
</html>
